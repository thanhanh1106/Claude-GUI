<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Demo: Tự lên kế hoạch → lập lịch → nhiều agent — Claude GUI</title>
<style>
  :root {
    --bg:#f6f8f1; --sidebar:#ecf0e2; --surface:#fff; --surface-2:#eef2e6; --hover:rgba(47,58,40,.06);
    --text:#2f3a28; --text-2:#43503a; --muted:#6c7a61; --faint:#9fac93; --border:#dde5cf; --border-strong:#c9d4b6;
    --accent:#5b8a3a; --accent-soft:rgba(91,138,58,.12); --user-bg:#e5ecd6; --code-bg:#eef2e6;
    --add-bg:rgba(76,138,46,.13); --add-fg:#3f7a24; --del-bg:rgba(196,69,60,.1); --del-fg:#c4453c; --warn:#b07d1a; --blue:#3f7f8f;
    --haiku:#3f9f8f; --sonnet:#6a7fdb; --opus:#c96442; --fable:#a05cc8;
    --mono:"Cascadia Code",Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#e3e8d8; color:var(--text); font:13.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  header { max-width:1320px; margin:0 auto; padding:16px 8px 6px; }
  h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); max-width:1100px; }
  .steps { max-width:1320px; margin:10px auto 0; display:flex; gap:6px; flex-wrap:wrap; padding:0 8px; }
  .steps button { border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2); border-radius:10px; padding:7px 13px; cursor:pointer; font:inherit; display:flex; gap:7px; align-items:center; }
  .steps button b { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--surface-2); font-size:12px; }
  .steps button.on { background:var(--accent); border-color:var(--accent); color:#fff; } .steps button.on b { background:rgba(255,255,255,.25); }
  .cap { max-width:1320px; margin:8px auto 0; padding:9px 14px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:10px; color:var(--text-2); }
  .win { max-width:1320px; height:740px; margin:10px auto 28px; background:var(--bg); border:1px solid var(--border-strong); border-radius:14px; overflow:hidden; display:grid; grid-template-columns:220px 1fr; box-shadow:0 18px 50px rgba(47,58,40,.18); }
  .sb { background:var(--sidebar); border-right:1px solid var(--border); padding:12px 8px; font-size:13px; }
  .sb .logo { font-weight:700; padding:2px 8px 12px; display:flex; gap:7px; align-items:center; } .sb .logo i { color:#6f9e4a; font-style:normal; font-size:18px; }
  .sb .it { padding:6px 9px; border-radius:8px; color:var(--text-2); display:flex; gap:7px; align-items:center; }
  .sb .it.on { background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .sb .bd { margin-left:auto; background:var(--accent); color:#fff; border-radius:9px; font-size:11px; padding:0 6px; }
  .sb h5 { margin:12px 9px 3px; color:var(--faint); font-weight:500; font-size:11.5px; }
  .sb .s { padding:4px 9px; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:7px; }
  .sb .s.run::before { content:'●'; color:var(--accent); margin-right:5px; animation:bl 1.2s infinite; } @keyframes bl { 50% { opacity:.3; } }
  .sb .s.done::before { content:'✓'; color:var(--add-fg); margin-right:5px; } .sb .s.wait::before { content:'○'; color:var(--faint); margin-right:5px; }
  .sb .s.ask::before { content:'?'; color:#fff; background:var(--warn); border-radius:50%; display:inline-grid; place-items:center; width:14px; height:14px; font-size:10px; margin-right:5px; }
  .main { overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .top { padding:11px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--bg); }
  .top b { font-size:14.5px; } .top .sp { flex:1; }
  .pill { font-size:11.5px; border-radius:9px; padding:1px 8px; border:1px solid var(--border-strong); color:var(--text-2); background:var(--surface); white-space:nowrap; }
  .m-haiku { color:var(--haiku); border-color:color-mix(in srgb,var(--haiku) 45%,transparent); background:color-mix(in srgb,var(--haiku) 9%,#fff); }
  .m-sonnet { color:var(--sonnet); border-color:color-mix(in srgb,var(--sonnet) 45%,transparent); background:color-mix(in srgb,var(--sonnet) 9%,#fff); }
  .m-opus { color:var(--opus); border-color:color-mix(in srgb,var(--opus) 45%,transparent); background:color-mix(in srgb,var(--opus) 9%,#fff); }
  .body { flex:1; overflow:auto; }
  .btn { border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; font-size:13px; }
  .btn:hover { border-color:var(--accent); } .btn.pri { background:var(--accent); color:#fff; border-color:var(--accent); } .btn.sm { padding:3px 9px; font-size:12px; }
  .btn.warn { color:var(--del-fg); }
  select, textarea, input[type=text] { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:7px; padding:3px 6px; }
  /* chat */
  .chat { max-width:860px; margin:0 auto; padding:18px 22px 30px; display:flex; flex-direction:column; gap:10px; }
  .u { align-self:flex-end; background:var(--user-bg); border-radius:14px; padding:9px 13px; max-width:78%; }
  .u .att { display:flex; gap:6px; margin-bottom:6px; } .u .att span { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:2px 8px; font-size:12px; }
  .a { color:var(--text); } .a p { margin:4px 0; }
  .tl { border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:5px 10px; font-size:12.5px; color:var(--muted); display:flex; gap:8px; align-items:center; animation:pop .35s ease both; }
  .tl b { color:var(--text); font-weight:600; } .tl .ok { margin-left:auto; color:var(--add-fg); }
  .tl.skill { border-color:color-mix(in srgb,var(--accent) 40%,transparent); background:var(--accent-soft); color:var(--text-2); }
  @keyframes pop { from { opacity:0; transform:translateY(6px); } }
  .q { border:1px solid var(--border-strong); background:var(--surface); border-radius:12px; padding:12px 14px; box-shadow:0 4px 16px rgba(47,58,40,.08); animation:pop .35s ease both; }
  .q h4 { margin:0 0 8px; font-size:14px; display:flex; gap:7px; align-items:center; }
  .q .op { border:1px solid var(--border); border-radius:9px; padding:8px 11px; margin-top:6px; cursor:pointer; display:flex; gap:10px; }
  .q .op:hover { border-color:var(--accent); background:var(--accent-soft); } .q .op b { display:block; } .q .op small { color:var(--muted); }
  .q .op .k { flex:none; width:20px; height:20px; border-radius:6px; background:var(--surface-2); display:grid; place-items:center; font-size:11.5px; color:var(--muted); }
  .plancard { border:1px solid color-mix(in srgb,var(--accent) 50%,transparent); background:linear-gradient(180deg,var(--accent-soft),var(--surface)); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; animation:pop .35s ease both; }
  .plancard .ic { font-size:26px; } .plancard b { display:block; } .plancard small { color:var(--muted); }
  .md { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; animation:pop .35s ease both; }
  .md h3 { margin:2px 0 6px; font-size:14px; } .md ol { margin:4px 0; padding-left:20px; } .md li { margin:1px 0; }
  /* duyệt */
  .rv { display:grid; grid-template-columns:330px 1fr; height:100%; }
  .rv-l { border-right:1px solid var(--border); padding:14px; overflow:auto; background:var(--surface-2); }
  .rv-r { padding:14px 18px; overflow:auto; }
  .box { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px; margin-bottom:10px; }
  .box h4 { margin:0 0 6px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .cost { display:flex; flex-direction:column; gap:6px; } .cost .row { display:flex; justify-content:space-between; font-size:12.5px; }
  .cbar { height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; } .cbar i { display:block; height:100%; transition:width .4s; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); } .legend span::before { content:''; display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; background:var(--c); }
  .phase { margin:6px 0 14px; } .phase > .ph { font-weight:650; font-size:13px; color:var(--text-2); margin:0 0 6px; display:flex; gap:8px; align-items:center; }
  .phase > .ph small { color:var(--faint); font-weight:400; }
  .task { border:1px solid var(--border); border-radius:11px; background:var(--surface); margin-bottom:7px; }
  .task .th { display:flex; gap:9px; align-items:center; padding:8px 11px; cursor:pointer; }
  .task .n { flex:none; width:22px; height:22px; border-radius:7px; background:var(--surface-2); display:grid; place-items:center; font-size:12px; color:var(--muted); font-weight:600; }
  .task .tt { flex:1; min-width:0; } .task .tt b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task .tt small { color:var(--muted); font-size:12px; }
  .task .why { color:var(--muted); font-size:12px; font-style:italic; }
  .task .td { display:none; padding:0 11px 11px 42px; } .task.open .td { display:block; }
  .task textarea { width:100%; min-height:110px; font:12.5px/1.45 var(--mono); background:var(--code-bg); }
  .task .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:12.5px; margin:6px 0; } .task .kv span:nth-child(odd) { color:var(--muted); }
  .task.chg { border-color:var(--warn); } .task.new { border-color:var(--add-fg); background:color-mix(in srgb,var(--add-bg) 60%,#fff); } .task.del { opacity:.55; text-decoration:line-through; }
  .ck { display:inline-flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); white-space:nowrap; }
  .dep { font-size:11.5px; color:var(--faint); white-space:nowrap; }
  .bar2 { position:sticky; bottom:0; background:linear-gradient(180deg,transparent,var(--bg) 30%); padding:14px 0 4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  /* chạy */
  .runv { display:grid; grid-template-columns:1fr 400px; height:100%; }
  .flow { padding:14px 18px; overflow:auto; }
  .st { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; border:1px solid transparent; }
  .st .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; border:2px solid var(--border-strong); background:var(--surface); color:var(--muted); }
  .st.done .dot { background:var(--add-fg); border-color:var(--add-fg); color:#fff; }
  .st.run { background:var(--surface); border-color:var(--accent); } .st.run .dot { border-color:var(--accent); border-top-color:transparent; animation:sp 1s linear infinite; } @keyframes sp { to { transform:rotate(360deg); } }
  .st.ask { background:#fff8e8; border-color:var(--warn); } .st.ask .dot { background:var(--warn); border-color:var(--warn); color:#fff; }
  .st.cp .dot { border-style:dashed; }
  .st small { color:var(--muted); font-size:12px; } .st .r { display:flex; gap:6px; align-items:center; }
  .ctx { border-left:1px solid var(--border); background:var(--surface-2); padding:12px; overflow:auto; }
  .ctx pre { white-space:pre-wrap; font:12px/1.5 var(--mono); background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:9px 10px; margin:6px 0 10px; }
  .ho { border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:7px 10px; margin-bottom:6px; font-size:12.5px; } .ho b { font-size:12.5px; } .ho div { color:var(--muted); }
  .tabs2 { display:flex; gap:4px; margin-bottom:8px; } .tabs2 span { padding:3px 10px; border-radius:8px; cursor:pointer; font-size:12.5px; color:var(--muted); } .tabs2 span.on { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  /* đổi lịch */
  .alert { border:1.5px solid var(--warn); background:#fffaf0; border-radius:13px; padding:13px 15px; margin-bottom:12px; }
  .alert h3 { margin:0 0 4px; font-size:15px; display:flex; gap:8px; align-items:center; }
  .alert .who { color:var(--muted); font-size:12.5px; }
  .alert blockquote { margin:8px 0; padding:7px 11px; border-left:3px solid var(--warn); background:var(--surface); border-radius:0 8px 8px 0; }
  .df { font:12.5px/1.6 var(--mono); }
  .df div { padding:1px 8px; border-radius:5px; } .df .p { background:var(--add-bg); color:var(--add-fg); } .df .m { background:var(--del-bg); color:var(--del-fg); } .df .c { background:#fbf1d9; color:#8a6210; }
  .pol { display:flex; gap:6px; flex-wrap:wrap; } .pol label { border:1px solid var(--border); border-radius:9px; padding:6px 10px; cursor:pointer; background:var(--surface); font-size:12.5px; } .pol label.on { border-color:var(--accent); background:var(--accent-soft); }
  .pol small { display:block; color:var(--muted); font-size:11.5px; }
  /* skill */
  .sk { max-width:880px; margin:0 auto; padding:18px 22px; }
  .skl { display:grid; gap:8px; }
  .skr { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px 13px; }
  .skr code { font:12px var(--mono); background:var(--surface-2); border-radius:5px; padding:1px 6px; }
  .skr .ic { font-size:22px; } .skr small { color:var(--muted); display:block; }
  .tg { width:34px; height:19px; border-radius:10px; background:var(--accent); position:relative; } .tg::after { content:''; position:absolute; right:2px; top:2px; width:15px; height:15px; border-radius:50%; background:#fff; }
  .skc pre { white-space:pre-wrap; font:12px/1.5 var(--mono); background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; max-height:300px; overflow:auto; }
  .note { color:var(--muted); font-size:12.5px; }
  .tlw .tl { display:block; } .tlw .tl .ok { float:right; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2f3a28; color:#fff; padding:8px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Demo: đưa design → Claude tự lên kế hoạch → bạn duyệt → nhiều agent chạy theo hàng đợi</h1>
  <p>Bấm lần lượt các bước. Mọi thứ trong demo là dữ liệu giả lập; các nút đều bấm được để xem luồng.</p>
</header>
<div class="steps" id="steps"></div>
<div class="cap" id="cap"></div>
<div class="win">
  <aside class="sb" id="sb"></aside>
  <section class="main"><div class="top" id="top"></div><div class="body" id="body"></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2200); };

// ---- trọng số chi phí tương đối (chỉnh được trong cài đặt; chỉ để so sánh) ----
const W = { haiku: 1, sonnet: 3, opus: 5 }, EW = { low: .6, medium: 1, high: 1.6, max: 2.4 };
const MN = { haiku: 'Haiku', sonnet: 'Sonnet', opus: 'Opus' }, EN = { low: 'thấp', medium: 'vừa', high: 'cao', max: 'tối đa' };

const TASKS = [
  { id: 't1', ph: 1, title: 'Đọc design, chốt mô hình dữ liệu Shop (Item, Offer, Bundle) + luồng mua', model: 'opus', eff: 'high', size: 3, why: 'Quyết định kiến trúc — mọi task sau dựa vào đây', acc: 'Có docs/shop-model.md; context.md ghi rõ các quyết định', deps: [] },
  { id: 't2', ph: 1, title: 'Dựng khung UI rỗng theo layout design (tab, lưới, header tiền tệ)', model: 'sonnet', eff: 'medium', size: 3, why: 'Bám layout nhiều chi tiết nhưng không khó', acc: 'Prefab ShopScreen mở được, đúng bố cục ảnh design', deps: ['t1'] },
  { id: 't3', ph: 1, title: 'Sinh enum/const + khoá localization cho mọi chuỗi trên màn Shop', model: 'haiku', eff: 'low', size: 1, why: 'Việc lặp, có khuôn sẵn', acc: 'Không còn chuỗi cứng trong ShopScreen', deps: ['t1'] },
  { id: 't4', ph: 2, title: 'Server: GET /shop, POST /shop/buy (trừ tiền, chống mua trùng)', model: 'sonnet', eff: 'high', size: 4, why: 'Logic tiền tệ — cần cẩn thận', acc: 'Có test thủ công bằng curl; trả lỗi rõ ràng khi thiếu tiền', deps: ['t1'] },
  { id: 't5', ph: 2, title: 'Client: ShopController gọi API, đổ dữ liệu vào lưới, trạng thái tải/lỗi', model: 'sonnet', eff: 'medium', size: 3, why: 'Nối UI với API theo mẫu có sẵn trong dự án', acc: 'Mở Shop thấy dữ liệu thật từ server dev', deps: ['t2', 't4'] },
  { id: 't6', ph: 2, title: 'Đồng hồ đếm ngược ưu đãi theo giờ (theo giờ server)', model: 'haiku', eff: 'medium', size: 1, why: 'Nhỏ, tách biệt, có ví dụ trong code', acc: 'Đếm đúng khi đổi giờ máy', deps: ['t5'] },
  { id: 't7', ph: 2, title: 'Popup xác nhận mua + hiệu ứng nhận vật phẩm', model: 'sonnet', eff: 'low', size: 2, why: 'UI theo design, ít logic', acc: 'Đúng design; huỷ không trừ tiền', deps: ['t5'] },
  { id: 't8', ph: 3, title: 'Viết test API mua (thiếu tiền, mua trùng, hết hạn ưu đãi)', model: 'haiku', eff: 'medium', size: 2, why: 'Test theo danh sách case rõ ràng', acc: 'npm test xanh', deps: ['t4'] },
  { id: 't9', ph: 3, title: 'Rà soát tổng: chạy test, đọc diff, so với design, liệt kê việc còn thiếu', model: 'opus', eff: 'medium', size: 2, why: 'Cần cái nhìn toàn cục để bắt lỗi chéo', acc: 'Báo cáo review; sửa ngay lỗi nhỏ', deps: ['t5', 't6', 't7', 't8'], cp: true },
];
const PH = { 1: ['Giai đoạn 1 — Nền móng', 'dừng chờ duyệt sau giai đoạn này'], 2: ['Giai đoạn 2 — Triển khai', ''], 3: ['Giai đoạn 3 — Kiểm tra', ''] };
TASKS.forEach((t) => { t.prompt = `Mục tiêu task: ${t.title}.\nTiêu chí xong: ${t.acc}.\nPhạm vi: chỉ sửa phần liên quan; không đổi API/mô hình đã chốt trong context.md — nếu thấy cần đổi, dùng skill xin đổi lịch.`; });

const cost = (ts) => ts.reduce((s, t) => s + W[t.model] * EW[t.eff] * t.size, 0);
const allOpus = (ts) => ts.reduce((s, t) => s + W.opus * EW.high * t.size, 0);

let step = 0, chatStage = 0, replan = 'ask', policy = 'ask';

const STEPS = [
  ['Bộ skill đi kèm', 'Cài GUI là có sẵn 3 skill. GUI nạp chúng cho mọi phiên mình mở bằng cờ <code>--plugin-dir</code> (chỉ phiên chạy từ GUI thấy, không đụng <code>~/.claude/skills</code> của bạn), tự cập nhật theo phiên bản app.'],
  ['Lên kế hoạch', 'Bạn đưa design và bảo "lên kế hoạch". Skill <b>lập kế hoạch</b> tự kích hoạt: Claude (model mạnh) đọc design + code, viết kế hoạch chi tiết rồi hỏi <b>"Bạn có muốn tôi tự động lập lịch trình chạy?"</b>.'],
  ['Duyệt hàng đợi', 'Claude chia thành nhiều task, <b>tự đề xuất model + effort</b> (kèm lý do) cho từng task. Bạn sửa prompt / model / effort / điểm dừng chờ duyệt, xem chi phí ước tính so với chạy hết bằng Opus, rồi duyệt.'],
  ['Đang chạy + ngữ cảnh', 'Mỗi task là một phiên mới (ngữ cảnh gọn → rẻ). GUI tự ghép vào prompt: <b>context.md</b> (bức tranh tổng) + <b>bàn giao</b> của các task nó phụ thuộc. Xong task, agent ghi bàn giao cho task sau.'],
