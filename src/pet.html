<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
  <title>Claude GUI — robot</title>
  <link rel="stylesheet" href="bot.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; }
    #host { position: absolute; right: 62px; bottom: 16px; width: 100px; height: 76px; cursor: pointer; transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; }
    body.enter #host { transform: translateY(70px) scale(.5); opacity: 0; }
    #host .mbot { transform-origin: 50% 85%; }
    .wrap { position: absolute; inset: 0; width: 120px; height: 91.2px; transform: scale(.8333); transform-origin: 0 0; }
    #bub { position: absolute; right: 8px; bottom: 136px; max-width: 300px; min-width: 150px; background: #f4f5f8; color: #16181d; padding: 9px 12px; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.35); opacity: 0; transform: translateY(8px) scale(.96); transition: .25s; pointer-events: none; }
    #bub.on { opacity: 1; transform: none; pointer-events: auto; }
    #bub::after { content: ""; position: absolute; bottom: -7px; right: 98px; width: 14px; height: 14px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
    #bub.ask { background: #fff4dc; box-shadow: 0 8px 26px rgba(0,0,0,.35), 0 0 0 2px #ffbc46; } #bub.err { background: #ffe3e3; }
    #bub b { display: block; margin-bottom: 1px; padding-right: 14px; } #bub .t { word-break: break-word; } #bub .s { opacity: .65; font-size: 12px; }
    #bub code { display: block; background: rgba(0,0,0,.07); border-radius: 5px; padding: 2px 6px; font: 12px Consolas, monospace; margin-top: 3px; white-space: pre-wrap; word-break: break-all; max-height: 60px; overflow: hidden; }
    #bub .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #bub button { border: 0; border-radius: 7px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; background: #e3e6ee; color: #16181d; }
    #bub button.p { background: #d97757; color: #fff; } #bub button:hover { filter: brightness(.95); }
    #bub .x { position: absolute; top: 3px; right: 7px; opacity: .45; cursor: pointer; }
    #tip { position: absolute; right: 8px; bottom: 100px; max-width: 260px; background: rgba(20,22,28,.92); color: #e8eaf0; font-size: 12px; padding: 5px 9px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #tip.on { opacity: 1; }
    /* nuôi robot: cửa sổ phủ cả vùng làm việc, robot đi lại tự do */
    body.life #host { display: none; }
    .lwrap { position: fixed; left: 0; top: 0; z-index: 250; width: 120px; height: 91.2px; transform-origin: 0 0; touch-action: none; cursor: pointer; }
    .lwrap.drag { cursor: grabbing; }
    body.life #bub { right: auto; bottom: auto; z-index: 300; } body.life #bub::after { right: auto; left: var(--ax, 50%); }
    body.life #tip { right: auto; bottom: auto; z-index: 300; }
    #say { position: fixed; z-index: 290; max-width: 240px; background: #f4f5f8; color: #16181d; padding: 5px 10px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #say.on { opacity: 1; } #say::after { content: ""; position: absolute; bottom: -5px; left: var(--ax, 50%); width: 10px; height: 10px; background: inherit; transform: rotate(45deg); }
    .pl-home { position: fixed; inset: 0; pointer-events: none; z-index: 240; }
    .pl-deco { position: absolute; line-height: 1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  </style>
</head>
<body class="enter">
  <div id="bub" class="hit"></div>
  <div id="tip"></div>
  <div id="say"></div>
  <div id="host" class="hit"><div class="wrap" id="wrap"></div></div>
  <script src="seasons.js"></script>
  <script src="bot.js"></script>
  <script src="petlife.js"></script>
  <script src="pet.js"></script>
</body>
</html>
